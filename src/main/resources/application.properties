
spring.application.name=StudentRegister
server.port=8080

# Database
spring.datasource.url=jdbc:mysql://localhost:13306/studentregister
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# HikariCP
spring.datasource.hikari.pool-name=StudentRegisterPool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.keepalive-time=120000

# Logging
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.level.com.zaxxer.hikari=INFO

# JWT
application.security.jwt.secret-key=${JWT_SECRET}
application.security.jwt.expiration=86400000

# Logging Configuration
logging.file.name=logs/student-register.log
logging.level.root=INFO
logging.level.com.example.studentregister=DEBUG
logging.level.org.springframework.security=DEBUG

